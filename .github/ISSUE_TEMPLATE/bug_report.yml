name: Bug report
description: Something doesn't compile, assemble, or run correctly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! comfylang is very early-stage, so
        please include as much detail as you can - it makes triage much faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal .cfy reproduction
      description: The smallest `.cfy` snippet that reproduces the issue.
      render: rust
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead (compiler output, exit code, panic, etc.)?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area (best guess)
      multiple: true
      options:
        - Lexer
        - Parser
        - Type checker
        - Codegen (ARM32)
        - IR
        - Diagnostics
        - Build/CI
        - Not sure
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/host architecture, and whether you used the Nix flake dev shell or something else.
      placeholder: "e.g. x86_64 Linux, via `nix develop`"
    validations:
      required: false
